<!doctype html>
<!-- Installing, in three steps: the stick, the installer's own screen, NoticeTV on the TV.
     docs/images/render.sh fills in @INSTALLER@ and @TV@ with VM screenshots. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.card { width: 1020px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 26px; }
.step { padding: 16px; }
.visual {
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  overflow: hidden;
  background: var(--raised);
  display: flex;
  align-items: center;
  justify-content: center;
}
.visual img { width: 100%; height: 100%; object-fit: cover; display: block; }
.visual .icon { width: 64px; height: 64px; }
.number {
  display: inline-flex;
  width: 24px;
  height: 24px;
  border-radius: 12px;
  background: var(--accent);
  color: #111526;
  font-size: 14px;
  font-weight: 700;
  align-items: center;
  justify-content: center;
  margin: 16px 0 10px;
}
.step h3 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.step p { font-size: 15px; color: var(--muted); margin: 6px 0 2px; line-height: 1.4; }
</style>
</head>
<body>
<div class="card">
  <p class="title">Install in three steps</p>
  <p class="subtitle">On any x86 mini PC, Secure Boot on</p>
  <div class="steps">
    <div class="step tile">
      <div class="visual">
        <!-- Lucide usb (ISC) -->
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="10" cy="7" r="1"/><circle cx="4" cy="20" r="1"/><path d="M4.7 19.3 19 5"/><path d="m21 3-3 1 2 2Z"/><path d="M9.26 7.68 5 12l2 5"/><path d="m10 14 5 2 3.5-3.5"/><path d="m18 12 1-1 1 1-1 1Z"/></svg></span>
      </div>
      <div class="number">1</div>
      <h3>Write the installer to a USB stick</h3>
      <p>With balenaEtcher or Raspberry Pi Imager</p>
    </div>
    <div class="step tile">
      <div class="visual"><img src="@INSTALLER@" alt="" style="object-position: top"></div>
      <div class="number">2</div>
      <h3>Start the PC from the stick</h3>
      <p>Press Enter, then type your Wi-Fi and dashboard</p>
    </div>
    <div class="step tile">
      <div class="visual"><img src="@TV@" alt=""></div>
      <div class="number">3</div>
      <h3>NoticeTV starts</h3>
      <p>Remove the stick: it restarts into NoticeTV</p>
    </div>
  </div>
</div>
</body>
</html>
