<!doctype html>
<!-- Choosing what the screen shows: the installer's two questions, from a VM.
     docs/images/render.sh fills in @WIFI@ and @DASHBOARD@. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.card { width: 900px; }
.screens { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 26px; }
.screen { padding: 16px; }
/* The installer writes in the top of its screen: show that band. */
.visual { aspect-ratio: 1280 / 330; border-radius: 8px; overflow: hidden; background: #000; }
.visual img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.screen h3 { font-size: 19px; font-weight: 600; margin: 16px 0 0; letter-spacing: -0.01em; }
.screen p { font-size: 15px; color: var(--muted); margin: 6px 0 2px; line-height: 1.4; }
</style>
</head>
<body>
<div class="card">
  <p class="title">Choose what it shows</p>
  <p class="subtitle">The installer asks. Start from the stick again to change it.</p>
  <div class="screens">
    <div class="screen tile">
      <div class="visual"><img src="@WIFI@" alt=""></div>
      <h3>Wi-Fi network</h3>
      <p>Or press Enter to use a network cable</p>
    </div>
    <div class="screen tile">
      <div class="visual"><img src="@DASHBOARD@" alt=""></div>
      <h3>Dashboard address</h3>
      <p>Any web page: the NoticeOS Wall, Grafana, your own</p>
    </div>
  </div>
</div>
</body>
</html>
