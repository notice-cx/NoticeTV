# Build the NoticeTV OS image: on demand from the Actions tab, and for every v* tag, where the
# image is attached to the tag's GitHub release.
name: Image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # attach the image to the tag's release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe names the image after the nearest tag

      - name: Let the build VM use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf e2fsprogs gdisk mtools xz-utils

      - name: Build the image
        run: image/build.sh

      - name: Keep the image and the build VM's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticetv-os
          path: dist/
          compression-level: 0  # the image is already xz-compressed

      - name: Attach the image to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "NoticeTV OS $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber dist/noticetv-os-*.img.xz dist/noticetv-os-*.img.xz.sha256
