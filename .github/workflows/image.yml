# Build the NoticeTV OS image and its USB installer, and test the installer end to end: on demand
# from the Actions tab, and for every v* tag, where both are attached to the tag's GitHub release.
name: Image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # attach the image to the tag's release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe names the image after the nearest tag

      - name: Let the build VM use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf e2fsprogs gdisk mtools xz-utils

      - name: Build the image
        run: image/build.sh

      # In Debian itself: the installer boots through Debian's signed shim, GRUB and kernel.
      - name: Build the installer
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:trixie sh -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              linux-image-amd64 initramfs-tools busybox xz-utils efibootmgr util-linux \
              shim-signed grub-efi-amd64-signed dosfstools mtools gdisk zstd >/dev/null &&
            installer/build.sh dist/noticetv-os-*-x86_64.img.xz'

      - name: Test the installer with Secure Boot on
        run: WORK="$RUNNER_TEMP" installer/test.sh dist/noticetv-installer-*-x86_64.img

      - name: Keep the image, the installer and the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticetv-os
          path: dist/
          compression-level: 0  # the image is already xz-compressed

      - name: Attach the installer and the image to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "NoticeTV OS $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/noticetv-installer-*.img dist/noticetv-installer-*.img.sha256 \
            dist/noticetv-os-*.img.xz dist/noticetv-os-*.img.xz.sha256
