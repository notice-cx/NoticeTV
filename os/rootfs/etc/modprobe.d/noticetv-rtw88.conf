# Realtek RTL8821CE and relatives (rtw88) can hard-freeze the whole machine with PCIe ASPM on:
# LKML 2026-03 "[BUG] wifi: rtw88: Hard system freeze on RTL8821CE when power_save is enabled".
# Ignored on boxes without an rtw88 card. See docs/hardware.md.
options rtw88_pci disable_aspm=y
options rtw88_core disable_lps_deep=y
